<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Open FEM2D Studio — klassieke simply-supported beam.
       Drie heldere witte vormen op de OpenAEC accent-tegel:
         1. Bold horizontale balk (rounded rect)
         2. Linker driehoek-oplegging
         3. Rechter driehoek-oplegging
       Bewust simpel zodat het leesbaar blijft op 16x16 en 32x32 taakbalk
       formaten — geen FE-knopen, geen gestippelde curve, geen tekst. -->
  <rect width="1024" height="1024" rx="200" fill="#d97706"/>

  <!-- Balk -->
  <rect x="128" y="448" width="768" height="88" rx="44" fill="white"/>

  <!-- Linker oplegging (driehoek) -->
  <polygon points="248,608 128,800 368,800" fill="white"/>

  <!-- Rechter oplegging (driehoek) -->
  <polygon points="776,608 656,800 896,800" fill="white"/>
</svg>
