[package]
name = "open-fem2d-studio"
version = "1.0.0"
description = "Open FEM2D Studio — 2D FEM solver"
authors = ["OpenAEC Foundation"]
license = "CC-BY-SA-4.0"
edition = "2021"

[lib]
name = "open_fem2d_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Workaround for GNU linker "export ordinal too large" on Windows.
# Tauri pulls in 366+ crates and the GNU ld.exe symbol table overflows.
# Strip debuginfo to reduce export count. MSVC toolchain avoids this entirely.
[profile.dev]
debug = 0
strip = "debuginfo"
incremental = false

[profile.release]
strip = "symbols"
lto = "thin"
