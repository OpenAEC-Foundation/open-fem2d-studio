[package]
name = "report"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib"]

[dependencies]
serde = { workspace = true }
ts-rs = { workspace = true }
# OpenAEC Foundation report layout engine — Rust equivalent of ReportLab Platypus.
# Vendored from crates-warehouse/openaec-layout (May 2026) into ../openaec-layout.
openaec-layout = { path = "../openaec-layout" }
steel-check = { path = "../steel-check" }
timber-check = { path = "../timber-check" }
concrete-check = { path = "../concrete-check" }
# Alleen voor de betonfiguren (`betonfiguren.rs`): die leiden de doorsnede en de
# korf af uit `ConcreteSection` / `ReinforcementCage` zelf, zodat de meetkunde
# uit dezelfde bron komt als de tekening op het scherm.
nen-en-1992-1-1 = { path = "../nen-en-1992-1-1" }
nen-en-1993-1-1-section = { path = "../nen-en-1993-1-1-section" }
nen-en-1993-1-1-stability = { path = "../nen-en-1993-1-1-stability" }

[dev-dependencies]
mechanics = { path = "../mechanics" }
nen-en-1995-1-1 = { path = "../nen-en-1995-1-1" }
serde_json = { workspace = true }
