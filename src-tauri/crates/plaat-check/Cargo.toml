[package]
name = "plaat-check"
version = "0.1.0"
edition = "2021"
description = "Normtoetsing van platen (wandschijven, belast in het vlak) per element"
license = "CC-BY-SA-4.0"

[lib]
crate-type = ["lib"]

[dependencies]
nationale-bijlage = { path = "../nationale-bijlage" }
serde = { workspace = true }
ts-rs = { workspace = true }
mechanics = { path = "../mechanics" }
# `NamedCheck`/`CheckKind` en `ResistanceCalc`/`Deelstap`: hetzelfde contract als
# de staaftoetsen, zodat paneel en rapport één weergavepad houden. Staal levert
# daarnaast tabel 3.1 (`SteelGrade::voor_dikte`).
nen-en-1993-1-1-section = { path = "../nen-en-1993-1-1-section" }
steel-check = { path = "../steel-check" }

[dev-dependencies]
approx = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "handberekening_staal"
path = "tests/handberekening_staal.rs"
