[package]
name = "toetsbrug"
version = "0.1.0"
edition = "2021"
description = "Normtoetsing als JSON-in/JSON-uit, zodat de browser dezelfde rekenkern bereikt als de desktop-app"
license = "CC-BY-SA-4.0"

# Bewust een eigen crate en geen binary in het Tauri-pakket: daar zou hij als
# tweede uitvoerbaar bestand naast de app staan, en de bundler pakte hem dan
# als hoofdprogramma — de installer bevatte de toetsbrug in plaats van de app.
#
# Lib + bin, om dezelfde reden als bij `openaec-mcp-server`: de
# opdrachtafhandeling (`behandel`) staat in het libdeel zodat een test erbij
# kan zonder een proces te starten. De drie-wegen-verificatie voor beton
# vergelijkt die functie met de MCP-server en met de rekengang achter het
# Tauri-command.
[lib]
name = "toetsbrug"
path = "src/lib.rs"

[[bin]]
name = "toetsbrug"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
steel-check = { path = "../steel-check" }
steel-profiles = { path = "../steel-profiles" }
nen-en-1993-1-1-section = { path = "../nen-en-1993-1-1-section" }
timber-check = { path = "../timber-check" }
nen-en-1995-1-1 = { path = "../nen-en-1995-1-1" }
concrete-check = { path = "../concrete-check" }
nen-en-1992-1-1 = { path = "../nen-en-1992-1-1" }
spanning-check = { path = "../spanning-check" }
nen-en-1993-1-8-las = { path = "../nen-en-1993-1-8-las" }
